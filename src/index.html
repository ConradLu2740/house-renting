<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租房区域综合评估与覆盖可视化推荐工具</title>

    <script>
        window._AMapSecurityConfig = {
            securityJsCode: '364a92ffd27ecb84a7c930743d041f7a'
        }
    </script>
    <script src="https://webapi.amap.com/loader.js"></script>
    <link rel="stylesheet" href="style.css">

    <!-- JS 模块（按依赖顺序加载） -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/evaluate.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="main-title">🏠 租房区域综合评估与覆盖可视化推荐工具</h1>

        <div class="main-content">
            <div class="left-panel">
                <div class="card">
                    <div class="card-title"><span>💼</span> 工作设定</div>
                    <div class="form-group autocomplete-container">
                        <label>公司地址（输入后选择）</label>
                        <input type="text" id="company-address" placeholder="请输入公司地址">
                        <div class="autocomplete-dropdown" id="address-dropdown"></div>
                    </div>
                    <div class="company-status" id="company-status">
                        <span class="company-dot"></span>
                        <span id="company-name"></span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><span>⚙️</span> 评估参数</div>
                    <div class="form-group">
                        <label>通勤方式</label>
                        <select id="transport-type">
                            <option value="transit">🚇 公交+地铁（推荐）</option>
                            <option value="driving">🚗 驾车</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>我的时薪（元/小时）</label>
                            <input type="number" id="hourly-wage" value="50" min="1" max="1000">
                        </div>
                        <div class="form-group">
                            <label>最长通勤时间（分钟）</label>
                            <input type="number" id="max-commute" value="60" min="1" max="300">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>搜索范围（公里）</label>
                            <select id="search-radius">
                                <option value="10">10公里</option>
                                <option value="15" selected>15公里</option>
                                <option value="20">20公里</option>
                                <option value="30">30公里</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>期望显示数量</label>
                            <select id="result-limit">
                                <option value="0">全部可达</option>
                                <option value="10">前 10 名</option>
                                <option value="20" selected>前 20 名</option>
                                <option value="30">前 30 名</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>期望租住面积（平米，用于估算参考租金）</label>
                        <input type="number" id="rent-area" value="30" min="5" max="200">
                    </div>
                    <div class="form-group">
                        <label>月预算上限（元，0=不限）</label>
                        <input type="number" id="budget-limit" value="0" min="0" max="99999">
                    </div>
                    <button class="btn-primary" id="start-btn">开始区域覆盖评估</button>
                    <button class="btn-cancel" id="cancel-btn" style="display:none;">⏹ 取消评估</button>

                    <div class="progress-container" id="progress-container">
                        <div class="progress-bar-wrapper">
                            <div class="progress-bar" id="progress-bar"></div>
                        </div>
                        <div class="progress-text" id="progress-text">准备中...</div>
                    </div>

                    <div class="status-message" id="status-message"></div>

                    <div class="btn-group">
                        <button class="btn-secondary" id="export-btn" disabled>📥 导出 CSV</button>
                        <button class="btn-secondary" id="clear-btn" disabled>🗑️ 清空租金</button>
                    </div>
                </div>

                <!-- 历史记录 -->
                <div class="card history-card">
                    <div class="card-title" style="justify-content: space-between;">
                        <span style="display: flex; align-items: center; gap: 8px;">
                            <span>📋</span> 历史记录
                        </span>
                        <button class="btn-clear-history" onclick="clearAllHistory()" title="清空全部">清空</button>
                    </div>
                    <div class="history-list" id="history-list"></div>
                </div>
            </div>

            <div class="right-panel">
                <div class="card map-card">
                    <div class="card-title"><span>🗺️</span> 区域覆盖可视化</div>
                    <div id="amap-container"></div>
                    <div class="legend">
                        <span class="legend-title">综合评分：</span>
                        <div>
                            <div class="legend-gradient"></div>
                            <div class="legend-labels">
                                <span>优 (低)</span>
                                <span>差 (高)</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card table-card">
                    <div class="card-title"><span>📊</span> 评估结果排行</div>
                    <div class="table-wrapper">
                        <table id="result-table">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>区域名称</th>
                                    <th>通勤方式</th>
                                    <th>单程耗时</th>
                                    <th>换乘</th>
                                    <th>痛苦指数</th>
                                    <th>月交通费</th>
                                    <th>参考月租</th>
                                    <th>月租金</th>
                                    <th>月总成本</th>
                                    <th>综合评分</th>
                                </tr>
                            </thead>
                            <tbody id="result-body">
                                <tr>
                                    <td colspan="11" style="text-align: center; color: #999; padding: 40px;">
                                        暂无评估结果，请先输入公司地址并点击"开始区域覆盖评估"
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
